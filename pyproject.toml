[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memtaint"
version = "0.1.0"
description = "Find agent memory writes that persist text from untrusted tool output (persistent prompt injection)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Md Rashedul Hasan"}]

[project.scripts]
memtaint = "memtaint.cli:main"

[tool.setuptools]
packages = ["memtaint"]
